<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>SellerFlow Capture</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <span class="badge">SF</span>
      <strong>SellerFlow Capture</strong>
      <span id="siteBadge" class="site-badge hidden"></span>
    </header>

    <div id="status" class="status">正在读取当前标签页…</div>

    <section id="form" class="form hidden">
      <label>商品标题</label>
      <input id="title" type="text" />

      <div class="row">
        <div>
          <label>售价</label>
          <input id="price" type="text" inputmode="decimal" />
        </div>
        <div>
          <label>原价</label>
          <input id="compareAt" type="text" inputmode="decimal" />
        </div>
        <div>
          <label>币种</label>
          <select id="currency">
            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
            <option value="CNY">CNY</option>
            <option value="GBP">GBP</option>
          </select>
        </div>
      </div>

      <label>描述（可缩短，AI 可后续重写）</label>
      <textarea id="description" rows="3"></textarea>

      <div class="row">
        <div>
          <label>SKU（可选）</label>
          <input id="sku" type="text" />
        </div>
        <div>
          <label>品牌/供应商</label>
          <input id="vendor" type="text" />
        </div>
      </div>

      <div class="section-title">
        选择图片 <span id="imgCount">0/0</span>
      </div>
      <div id="images" class="images"></div>
      <p id="variantsNote" class="hint hidden"></p>
    </section>

    <div class="actions">
      <button id="btnExtract" type="button">重新采集</button>
      <button id="btnJson" type="button" class="secondary" disabled>下载 JSON</button>
      <button id="btnSend" type="button" class="primary" disabled>发送到工作台</button>
    </div>

    <p class="hint">
      工作台默认 <code id="wbUrl">http://localhost:3000</code> ·
      <a href="#" id="openOptions">设置</a>
    </p>
    <script src="popup.js"></script>
  </body>
</html>
